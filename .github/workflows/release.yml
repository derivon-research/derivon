name: Release Derivon CLI

on:
  push:
    tags: ["derivon-cli-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing derivon-cli release tag to recover
        required: true
        type: string
      publish_only:
        description: Publish missing crates without rebuilding release assets
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#derivon-cli-v}"
          package_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "derivon-cli") | .version')
          test "$version" = "$package_version"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Build user documentation
        run: |
          cargo install mdbook --version 0.4.43 --locked
          mdbook build docs

  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_only != true
    needs: verify
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build
        run: cross build --release --locked -p derivon-cli --target "${{ matrix.target }}"
      - name: Create archive
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#derivon-cli-v}"
          archive="derivon-$version-${{ matrix.target }}.tar.gz"
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/derivon" "$staging/derivon"
          cp LICENSE README.md "$staging/"
          tar -C "$staging" -czf "$archive" derivon LICENSE README.md
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: derivon-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: derivon-*.tar.gz
          if-no-files-found: error

  github-release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum derivon-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/derivon-*.tar.gz artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Derivon CLI ${RELEASE_TAG#derivon-cli-v}"

  crates-io:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Read package versions
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          core_version=$(jq -r '.packages[] | select(.name == "derivon-core") | .version' <<<"$metadata")
          cli_version=$(jq -r '.packages[] | select(.name == "derivon-cli") | .version' <<<"$metadata")
          test -n "$core_version"
          test -n "$cli_version"
          echo "CORE_VERSION=$core_version" >> "$GITHUB_ENV"
          echo "CLI_VERSION=$cli_version" >> "$GITHUB_ENV"
      - name: Publish core if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if cargo info --registry crates-io "derivon-core@$CORE_VERSION" >/dev/null 2>&1; then
            echo "derivon-core $CORE_VERSION is already published"
          else
            cargo publish --locked -p derivon-core
          fi
      - name: Wait for core dependency index
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if cargo info --registry crates-io "derivon-core@$CORE_VERSION" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "derivon-core $CORE_VERSION did not reach the Cargo index" >&2
          exit 1
      - name: Publish CLI if needed
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if cargo info --registry crates-io "derivon-cli@$CLI_VERSION" >/dev/null 2>&1; then
            echo "derivon-cli $CLI_VERSION is already published"
          else
            cargo publish --locked -p derivon-cli
          fi
