[package]
name = "derivon-cli"
version = "0.1.1"
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Stateless Unix CLI for Derivon weighted directed B-hypergraphs"
readme = "../../README.md"

[lib]
name = "derivon_cli"
path = "src/lib.rs"

[[bin]]
name = "derivon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
derivon-core = { version = "0.2.0", path = "../derivon-core" }
rust_decimal = "1.42.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision", "unbounded_depth"] }
